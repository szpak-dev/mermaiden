, 185, 1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#my-svg [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g><rect x="1" y="15" width="507" height="32" class="packetBlock"/><text x="254.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Source port</text><text x="1" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="start">0</text><text x="508" y="13" class="packetByte end" dominant-baseline="auto" text-anchor="end">15</text><rect x="513" y="15" width="507" height="32" class="packetBlock"/><text x="766.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Destination port</text><text x="513" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="start">16</text><text x="1020" y="13" class="packetByte end" dominant-baseline="auto" text-anchor="end">31</text></g><g><rect x="1" y="62" width="507" height="32" class="packetBlock"/><text x="254.5" y="78" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Length</text><text x="1" y="60" class="packetByte start" dominant-baseline="auto" text-anchor="start">32</text><text x="508" y="60" class="packetByte end" dominant-baseline="auto" text-anchor="end">47</text><rect x="513" y="62" width="507" height="32" class="packetBlock"/><text x="766.5" y="78" class="packetLabel" dominant-baseline="middle" text-anchor="middle">Checksum</text><text x="513" y="60" class="packetByte start" dominant-baseline="auto" text-anchor="start">48</text><text x="1020" y="60" class="